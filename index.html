function stats(it){
 const l=(logs[it.id]||[]).filter(x=>x[2]!=="in"),now=Date.now();if(!l.length)return null;
 const first=Math.min(...l.map(x=>x[0]))*6e4,W=Math.min(12,Math.max(1,Math.ceil((now-first)/(7*DAY))));
 const wk=Array(W).fill(0);l.forEach(([t,n])=>{const k=Math.floor((now-t*6e4)/(7*DAY));if(k>=0&&k<W)wk[k]+=n});
 const avgW=wk.reduce((a,b)=>a+b,0)/W,maxW=Math.max(...wk),lead=it.lead||7;
 const safety=Math.ceil(Math.max(0,maxW-avgW)*lead/7),reorder=Math.ceil(avgW/7*lead)+safety;
 const mo=[],d=new Date();for(let i=0;i<6;i++){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,1);let c=0;l.forEach(([t,n])=>{const m=t*6e4;if(m>=a&&m<b)c+=n});mo.push([a.getFullYear()+"/"+(a.getMonth()+1),c])}
 return{W,wk,avgW,maxW,avgM:avgW/7*30,safety,reorder,lead,mo}
}

const THRE=new RegExp(TH.map(e=>e[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g"),THM=new Map(TH);
const trS=s=>{if(LANG==="zh")return s;if(LANG==="th")return s.replace(THRE,m=>THM.get(m));const core=s.trim().replace(/^[^\u3400-\u9fffA-Za-z0-9]*/,"");return s.replace(THRE,m=>{const th=THM.get(m).replace(/[\s:：]+$/,"");return m+(core===m?" ":" (")+th+(core===m?"":")")})};
function trApply(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){const p=n.parentNode&&n.parentNode.nodeName;if(p==="SCRIPT"||p==="STYLE"||(n.parentNode.closest&&n.parentNode.closest(".fc,[data-notr]")))continue;const v=n.data;let o=ORG.get(n);if(!o||o.t!==v)o={z:v,t:v};const t=LANG==="zh"?o.z:trS(o.z);if(t!==v)n.data=t;o.t=t;ORG.set(n,o)}
 document.querySelectorAll("[placeholder],[title]").forEach(el=>{for(const a of["placeholder","title"]){if(!el.hasAttribute(a))continue;const k="oz"+a,cur=el.getAttribute(a);if(el.dataset[k]===undefined||el.dataset[k+"t"]!==cur)el.dataset[k]=cur;const t=LANG==="zh"?el.dataset[k]:trS(el.dataset[k]);el.dataset[k+"t"]=t;if(cur!==t)el.setAttribute(a,t)}})}
new MutationObserver(()=>{clearTimeout(trT);trT=setTimeout(trApply,30)}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["placeholder","title"]});

function saveFac(){touch();try{localStorage.setItem("toolfac",JSON.stringify(FAC))}catch(e){}if(fref)fref.set(FAC).catch(()=>{})}
const isM=t=>/^T[AB]\d{2,3}$/i.test(String(t||"").trim());
const FU=(()=>{const U=[];for(const[sh,S]of Object.entries(FACT)){const cov={};S.cells.forEach((c,i)=>{for(let r=c[0];r<c[0]+c[2];r++)for(let q=c[1];q<c[1]+c[3];q++)cov[r+","+q]=i});
 S.cells.forEach((c,i)=>{if(isM(c[4])){const pi=cov[(c[0]-1)+","+c[1]],pc=pi!==undefined?S.cells[pi]:null;U.push({sh,key:cn(c[1]-1)+c[0],mi:i,pi:pc&&pc[4]&&!isM(pc[4])?pi:-1})}})}return U})();
const shn=s=>s.replace(/產品$/,"");
function facUnits(){return FU.map(u=>{const S=FACT[u.sh],o=FAC.ov[u.sh+"|"+u.key]||{},p0=u.pi>=0?S.cells[u.pi][4]:"",m0=S.cells[u.mi][4];return{...u,p0,m0,p:o.p!==undefined?o.p:p0,m:o.m!==undefined?o.m:m0}})}
const facProducts=()=>[...new Set(FU.filter(u=>u.pi>=0).map(u=>FACT[u.sh].cells[u.pi][4]).filter(Boolean))];
function machLine(p){const m=facUnits().filter(u=>u.p===p);return m.length?'<div class="s">機台：'+m.map(u=>esc(shn(u.sh)+" "+u.m)).join("、")+"</div>":""}
const PAL=["#fde68a","#bfdbfe","#bbf7d0","#fecaca","#e9d5ff","#fed7aa","#a5f3fc","#fbcfe8","#d9f99d","#c7d2fe","#fde047","#99f6e4"];
const hashS=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h};
function facFix(){FAC.cx=FAC.cx||{};FAC.add=FAC.add||{};FAC.pc=FAC.pc||{};FAC.ov=FAC.ov||{}}
const pcol=p=>FAC.pc[p]||PAL[hashS(p)%PAL.length];
const LBL={"分電":"ตู้ไฟย่อย","逃生門":"ประตูหนีไฟ","捲門":"ประตูม้วน","鐵捲門":"ประตูม้วนเหล็ก","主電":"ไฟหลัก","飲水機":"ที่กดน้ำดื่ม","刀模具室":"ห้องมีด/แม่พิมพ์","雜物室":"ห้องเก็บของ","電梯":"ลิฟต์","樓梯":"บันได","茶水室":"ห้องน้ำชา","男廁":"ห้องน้ำชาย","女廁":"ห้องน้ำหญิง","龍門":"เครื่องแกนตั้งแบบเกต","油水:":"น้ำมัน/น้ำ:","培訓技士:":"ช่างฝึกหัด:","幹部:":"หัวหน้างาน:","早班08:00-17:00":"กะเช้า 08:00-17:00","A廠產品":"ผลิตภัณฑ์โรงงาน A","D廠產品":"ผลิตภัณฑ์โรงงาน D","泰國廠A":"โรงงานไทย A","泰國廠-D":"โรงงานไทย D","380V主電箱":"ตู้ไฟหลัก 380V","OFFICE":"สำนักงาน","QCROOM":"ห้อง QC","ELECTRICITYROOM":"ห้องไฟฟ้า","新方塊":"บล็อกใหม่"};
const LBRE=new RegExp(Object.keys(LBL).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g");
function facTh(t){const k=String(t).replace(/\s+/g,"");if(LBL[k])return LBL[k];let ch=false;const r=k.replace(LBRE,m=>{ch=true;return LBL[m]+" "});return ch?r.trim():""}
function facCells(sh){const S=FACT[sh],X=FAC.cx||{},out=[];S.cells.forEach((c,i)=>{const o=X[sh+"|"+i];if(o&&o.x)return;const e=c.slice();if(o){if(o.r)e[0]=o.r;if(o.c)e[1]=o.c;if(o.rs)e[2]=o.rs;if(o.cs)e[3]=o.cs;if(o.t!==undefined)e[4]=o.t;if(o.bg!==undefined)e[5]=o.bg;if(o.b!==undefined)e[6]=o.b;if(o.z)e[7]=o.z}out.push({e,k:String(i),i})});
 ((FAC.add||{})[sh]||[]).forEach((c,j)=>out.push({e:c,k:"n"+j,i:-1}));return out}
const curFc=key=>{const[sh,k]=key.split("|"),f=facCells(sh).find(x=>x.k===k);return f?f.e:null};
let facEdit=false,fk=null,facDel=false,facRst=false;
function renderFac(){facFix();const S=FACT[facSheet],q=nz($("q").value),old=$("facv").querySelector(".fw"),sl=old?old.scrollLeft:0,st=old?old.scrollTop:0,adm=canW;
 const U=facUnits().filter(u=>u.sh===facSheet),role={};U.forEach(u=>{role[u.mi]={u,k:"m"};if(u.pi>=0)role[u.pi]={u,k:"p"}});
 const prods=[...new Set(U.map(u=>u.p).filter(Boolean))];let any=false;
 let h='<div class="row" style="margin:0 0 8px">'+Object.keys(FACT).map(s=>`<button class="${s===facSheet?"p":""}" data-sh="${s}">${shn(s)}</button>`).join("")+'<span style="flex:1"></span>'
 +(adm?`<button class="${facEdit?"p":""}" data-fe="edit">✏ 編輯排版</button>`+(facEdit?'<button data-fe="add">＋ 新增方塊</button>':"")+`<button data-fe="rst"${facRst?' class="p" style="background:var(--warn);border-color:var(--warn)"':""}>${facRst?"再按一次確定還原":"還原整張圖"}</button>`:"")
 +`<button class="${FAC.byp?"p":""}" data-fe="byp">🎨 依產品上色</button><button data-z="-">－</button><button data-z="+">＋</button><button data-fz="fit">全圖</button><button data-fz="full">${facFull?"✕ 結束全螢幕":"⛶ 全螢幕"}</button></div>${innerWidth<700?'<div class="s" style="margin:0 0 6px">手機請橫放螢幕並用兩指縮放，細節會更清楚；按「⛶ 全螢幕」可以看整張圖。</div>':""}`;
 if(FAC.byp)h+='<div class="row s" style="margin:0 0 8px">'+(prods.length?prods.map(p=>`<label style="display:inline-flex;align-items:center;gap:4px"><input type="color" style="width:28px;height:24px;padding:0" data-pc="${esc(p)}" value="${pcol(p)}"${adm?"":" disabled"}>${esc(p)}</label>`).join(""):"這張圖還沒有指定加工產品")+"</div>";
 if(facEdit)h+='<div class="s" style="color:var(--warn);margin:0 0 6px">編輯排版模式：點任何方塊可改顏色、文字、大小、位置。機台的產品請關閉編輯模式後點機台修改。</div>';
 const cells=facCells(facSheet).map(({e:c,k,i})=>{const r=i>=0?role[i]:null;let t=c[4],bg=c[5];
  if(r){t=r.k==="m"?r.u.m:r.u.p;if(r.k==="m"&&r.u.pi<0&&r.u.p)t+="\n"+r.u.p;if(FAC.byp&&r.k==="m"&&r.u.p)bg=pcol(r.u.p)}
  const hit=q&&nz(t).includes(q);if(hit)any=true;const b=c[8];let w=0;for(let x=c[1]-1;x<c[1]-1+c[3];x++)w+=S.cols[x]||0;
  const thx=LANG!=="zh"&&!r?facTh(t):"",wide=w>=56,inner=(LANG==="th"&&thx)?esc(thx):esc(t)+(LANG==="both"&&thx&&wide?`<small class="fth">${esc(thx)}</small>`:""),tip=thx&&!wide?` title="${esc(thx)}"`:"";
  return `<div class="fc${r?" fu":""}${r&&r.k==="p"?" fp":""}${hit?" hit":""}${facEdit&&fk===facSheet+"|"+k?" sel":""}" data-ck="${facSheet}|${k}"${r?` data-u="${r.u.sh}|${r.u.key}"`:""}${tip} style="grid-area:${c[0]}/${c[1]}/span ${c[2]}/span ${c[3]};background:${bg||"#fff"};font-size:${Math.max(7,Math.round(c[7]*1.05))}px;font-weight:${c[6]?700:400};border-width:${b&2?1:0}px ${b&4?1:0}px ${b&8?1:0}px ${b&1?1:0}px">${inner}</div>`}).join("");
 $("facv").innerHTML=h+`<div class="fw"><div class="fg${q?" f":""}" style="zoom:${facZ};grid-template-columns:${S.cols.map(w=>w+"px").join(" ")};grid-template-rows:${S.rows.map(w=>w+"px").join(" ")}">${cells}</div></div>`+(q&&!any?'<div class="empty">這張圖裡找不到「'+esc($("q").value)+'」</div>':"");
 const nw=$("facv").querySelector(".fw");if(nw){nw.scrollLeft=sl;nw.scrollTop=st;const hi=nw.querySelector(".hit");if(hi&&q)hi.scrollIntoView({block:"nearest",inline:"center"})}}
function fcPatch(key,p){const[sh,k]=key.split("|"),f=facCells(sh).find(x=>x.k===k);if(!f)return;const e=f.e,R=FACT[sh].rows.length,C=FACT[sh].cols.length;
 const n={r:p.r??e[0],c:p.c??e[1],rs:p.rs??e[2],cs:p.cs??e[3],t:p.t??e[4],bg:p.bg??e[5],b:p.b??e[6],z:p.z??e[7]};
 n.rs=Math.max(1,Math.min(n.rs,R));n.cs=Math.max(1,Math.min(n.cs,C));n.r=Math.max(1,Math.min(n.r,R-n.rs+1));n.c=Math.max(1,Math.min(n.c,C-n.cs+1));
 if(k[0]==="n"){const a=FAC.add[sh][+k.slice(1)];a[0]=n.r;a[1]=n.c;a[2]=n.rs;a[3]=n.cs;a[4]=n.t;a[5]=n.bg;a[6]=n.b;a[7]=n.z}
 else FAC.cx[key]=Object.assign(FAC.cx[key]||{},{r:n.r,c:n.c,rs:n.rs,cs:n.cs,bg:n.bg,b:n.b,z:n.z},p.t!==undefined?{t:n.t}:{})}
function fcMove(key,dr,dc){const[sh,k]=key.split("|"),keys=[key];if(k[0]!=="n"){const i=+k,u=FU.find(x=>x.sh===sh&&(x.mi===i||x.pi===i));if(u)[u.mi,u.pi].forEach(j=>{if(j>=0&&j!==i)keys.push(sh+"|"+j)})}
 keys.forEach(kk=>{const e=curFc(kk);if(e)fcPatch(kk,{r:e[0]+dr,c:e[1]+dc})})}
function openFacEd(key){fk=key;const[sh,k]=key.split("|"),f=facCells(sh).find(x=>x.k===k);if(!f)return;const e=f.e,unit=f.i>=0&&FU.some(u=>u.sh===sh&&(u.mi===f.i||u.pi===f.i)),d=$("fedlg");
 d.innerHTML=`<b>編輯方塊</b><label>文字</label><textarea id="fe_t" rows="2"${unit?" disabled":""}>${esc(unit?"（機台／產品方塊，文字請關閉編輯模式後修改）":e[4])}</textarea>
<label>背景顏色</label><div class="row"><input type="color" id="fe_bg" value="${/^#[0-9a-f]{6}$/i.test(e[5])?e[5]:"#ffffff"}" style="width:60px"><button data-fe2="nobg">無色</button>${PAL.map(c=>`<button data-sw="${c}" style="background:${c};width:26px;height:26px;padding:0"></button>`).join("")}</div>
<div class="g"><div><label>字級</label><input id="fe_z" type="number" min="6" max="60" value="${e[7]}"></div><div><label>&nbsp;</label><label><input id="fe_b" type="checkbox" style="width:auto"${e[6]?" checked":""}> 粗體</label></div></div>
<label>${unit?"移動（連同機台與產品一起）":"移動（單一方塊）"}</label><div class="row"><button data-mv="0,-1">←</button><button data-mv="-1,0">↑</button><button data-mv="1,0">↓</button><button data-mv="0,1">→</button></div>
<label>大小（列 × 欄）</label><div class="row"><button data-sz="-1,0">列 －</button><button data-sz="1,0">列 ＋</button><button data-sz="0,-1">欄 －</button><button data-sz="0,1">欄 ＋</button></div>
<div class="row"><button data-fe2="del"${facDel?' class="p" style="background:var(--warn);border-color:var(--warn)"':""}>${facDel?"再按一次確定刪除":"刪除方塊"}</button><button data-fe2="rs">還原此方塊</button><button class="p" data-fe2="x" style="margin-left:auto">完成</button></div>`;
 if(!d.open)d.showModal();renderFac()}
$("fedlg").onclick=e=>{const t=e.target,key=fk,d=t.dataset;if(!key||!canW)return;
 if(d.sw!==undefined)fcPatch(key,{bg:d.sw});
 else if(d.mv){const[a,b]=d.mv.split(",").map(Number);fcMove(key,a,b)}
 else if(d.sz){const[a,b]=d.sz.split(",").map(Number),c0=curFc(key);fcPatch(key,{rs:c0[2]+a,cs:c0[3]+b})}
 else if(d.fe2==="nobg")fcPatch(key,{bg:""});
 else if(d.fe2==="rs")delete FAC.cx[key];
 else if(d.fe2==="del"){if(!facDel){facDel=true;openFacEd(key);return}facDel=false;const[sh,k]=key.split("|");if(k[0]==="n")FAC.add[sh].splice(+k.slice(1),1);else FAC.cx[key]=Object.assign(FAC.cx[key]||{},{x:1});fk=null;saveFac();$("fedlg").close();renderFac();return}
 else if(d.fe2==="x"){$("fedlg").close();return}
 else return;
 facDel=false;saveFac();renderFac();openFacEd(key)};
$("fedlg").onchange=e=>{const t=e.target,key=fk;if(!key||!canW)return;
 if(t.id==="fe_t")fcPatch(key,{t:t.value});else if(t.id==="fe_bg")fcPatch(key,{bg:t.value});else if(t.id==="fe_b")fcPatch(key,{b:t.checked?1:0});else if(t.id==="fe_z")fcPatch(key,{z:Math.max(6,Math.min(60,+t.value||12))});else return;saveFac();renderFac()};
$("fedlg").addEventListener("close",()=>{fk=null;facDel=false;renderFac()});
function addFacBlock(){facFix();const sh=facSheet;(FAC.add[sh]=FAC.add[sh]||[]).push([2,2,3,4,"新方塊","#fde68a",1,14,15,""]);saveFac();openFacEd(sh+"|n"+(FAC.add[sh].length-1))}
function openFacU(uk,pSel,mVal){fu=facUnits().find(u=>u.sh+"|"+u.key===uk);if(!fu)return;const d=$("fdlg"),cur=pSel!==undefined?pSel:fu.p,list=[...PRODS];if(cur&&!list.includes(cur))list.push(cur);
 d.innerHTML=`<b>${shn(fu.sh)} · 機台 ${esc(fu.m0)}</b><label>目前加工產品</label><select id="fd_p"><option value="">（空白）</option>${list.map(p=>`<option value="${esc(p)}"${p===cur?" selected":""}>${esc(p)}</option>`).join("")}</select>
<div class="row"><input id="fd_np" placeholder="沒有想要的產品？在這裡新增" style="flex:1;min-width:0"><button id="fd_ap" type="button">＋ 新增產品</button></div>
<label>機台編號</label><input id="fd_m" value="${esc(mVal!==undefined?mVal:fu.m)}">
<div class="row"><button id="fd_r">還原成 Excel 原值</button><button id="fd_x" style="margin-left:auto">取消</button><button class="p" id="fd_s">儲存</button></div>`;if(!d.open)d.showModal()}
$("fdlg").onclick=e=>{const id=e.target.id;if(id==="fd_x")return $("fdlg").close();if(!canW||!fu)return;const k=fu.sh+"|"+fu.key;
 if(id==="fd_ap"){const n=$("fd_np").value.trim();if(!n)return;if(!PRODS.includes(n)){PRODS.push(n);saveProds()}openFacU(k,n,$("fd_m").value);return}
 if(id==="fd_r"){delete FAC.ov[k];saveFac();$("fdlg").close();renderFac();return}
 if(id==="fd_s"){const p=$("fd_p").value,m=$("fd_m").value.trim(),o={};if(p!==fu.p0)o.p=p;if(m&&m!==fu.m0)o.m=m;if(Object.keys(o).length)FAC.ov[k]=o;else delete FAC.ov[k];saveFac();$("fdlg").close();renderFac()}};
$("facv").onclick=e=>{const t=e.target;if(t.dataset.sh){facSheet=t.dataset.sh;facRst=false;renderFac();return}
 if(t.dataset.fz){if(t.dataset.fz==="fit")facFit=true;else{facFull=!facFull;facFit=true;$("facv").classList.toggle("full",facFull);document.body.style.overflow=facFull?"hidden":""}renderFac();return}
 if(t.dataset.z){facFit=false;facZ=Math.min(3,Math.max(.15,facZ+(t.dataset.z==="+"?.15:-.15)));renderFac();return}
 const fe=t.dataset.fe;if(fe){if(fe==="byp"){facFix();FAC.byp=!FAC.byp;saveFac()}else{if(!canW)return;if(fe==="edit")facEdit=!facEdit;else if(fe==="add"){addFacBlock();return}
   else if(fe==="rst"){if(!facRst){facRst=true;renderFac();return}facRst=false;facFix();Object.keys(FAC.cx).forEach(kk=>{if(kk.startsWith(facSheet+"|"))delete FAC.cx[kk]});delete FAC.add[facSheet];saveFac()}}
  renderFac();return}
 const c=t.closest(".fc");if(!c)return;if(facEdit&&canW){openFacEd(c.dataset.ck);return}
 if(c.dataset.u&&canW)openFacU(c.dataset.u)};
$("facv").onchange=e=>{const t=e.target;if(t.dataset.pc&&canW){facFix();FAC.pc[t.dataset.pc]=t.value;saveFac();renderFac()}};
$("v_f").onclick=()=>{view="f";focusK=null;render()};
function openCats(){const d=$("kdlg"),cnt=c=>items.filter(i=>i.cat===c).length;
 d.innerHTML='<b>編輯分類</b><div class="s">可新增加工刀具的分類；還有刀具的分類不能刪除。</div>'+CATS.map((c,i)=>`<div class="r"><span>${c.replace(/</g,"&lt;")}（${cnt(c)} 筆）</span><button data-r="${i}">改名</button><button data-k="${i}">刪除</button></div>`).join("")+'<div class="row"><input id="k_n" placeholder="新分類名稱（例：鑽頭刀桿）"><button class="p" data-k="add">新增</button></div><div id="k_m" class="s" style="color:var(--warn)"></div><div class="row"><button data-k="x" style="margin-left:auto">關閉</button></div>';
 if(!d.open)d.showModal()}
$("kdlg").onclick=async e=>{const rr=e.target.dataset.r;
 if(rr!==undefined){if(!canW)return;const old=CATS[+rr],n=await askText("新的分類名稱",old);if(!n||n===old)return;if(CATS.includes(n)){$("k_m").textContent="已經有這個分類";return}
  CATS[+rr]=n;items.forEach(it=>{if(it.cat===old)it.cat=n});if(cat===old)cat=n;saveCats();save();render();openCats();return}
 const k=e.target.dataset.k;if(k===undefined||!canW)return;if(k==="x")return $("kdlg").close();
 if(k==="add"){const n=$("k_n").value.trim();if(!n)return;if(CATS.includes(n)){$("k_m").textContent="已經有這個分類";return}CATS.push(n);saveCats();render();openCats();return}
 const c=CATS[+k];if(items.some(i=>i.cat===c)){$("k_m").textContent="「"+c+"」還有刀具，請先把刀具移到其他分類再刪除";return}
 if(CATS.length<=1){$("k_m").textContent="至少要保留一個分類";return}
 CATS.splice(+k,1);if(cat===c)cat="全部";saveCats();render();openCats()};
if(CLOUD){if(SES)cloudStart();else showLogin()}
whoP.then(v=>{if(!CLOUD)canW=v;render()});
render();
</script></body></html>
