<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刀具管理</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--mut:#6b7280;--card:#fff;--bd:#d9dde3;--ac:#2563eb;--warn:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#e8eaee;--mut:#9aa3af;--card:#1f242b;--bd:#343b45;--ac:#60a5fa;--warn:#f87171}}
:root[data-theme="dark"]{--bg:#15181d;--fg:#e8eaee;--mut:#9aa3af;--card:#1f242b;--bd:#343b45;--ac:#60a5fa;--warn:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;box-sizing:border-box}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border-radius:99px}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.m{font-weight:600;word-break:break-all}.s{color:var(--mut);font-size:13px}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;color:var(--mut);white-space:nowrap}
.low{color:var(--warn);border-color:var(--warn)}.high{color:#d97706;border-color:#d97706}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.q{display:flex;align-items:center;gap:8px;margin-right:auto}.q b{min-width:28px;text-align:center;font-size:18px}
dialog{max-height:88vh;overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);width:min(92vw,420px);padding:16px}
dialog label{display:block;font-size:13px;color:var(--mut);margin-top:8px}dialog input,dialog select,dialog textarea{width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--bd);font-size:14px}.h{font-weight:600;margin:12px 0 4px}
[hidden]{display:none!important}.th{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);flex:none;cursor:pointer}#f_prev{width:80px;height:80px}
.ro [data-a=dec],.ro [data-a=inc],.ro [data-a=edit],.ro [data-a=del],.ro [data-a=apply],.ro [data-a=dellog],.ro .adm{display:none}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
#map{overflow-x:auto;padding-bottom:8px}
.mg{display:grid;grid-template-columns:24px repeat(9,minmax(104px,1fr));gap:4px;min-width:980px}
.mh,.rl{display:flex;align-items:center;justify-content:center;font-weight:700}.mh{padding:4px 0}
.c{border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:6px;font-size:11.5px;line-height:1.35;min-height:52px;word-break:break-all;cursor:pointer}
.c.hit{outline:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 20%,var(--card))}
.mg.f .c:not(.hit){opacity:.3}
.empty{text-align:center;color:var(--mut);padding:32px 0}
</style></head><body><main>
<h1>🔧 刀具管理</h1>
<div id="rob" class="s" hidden style="margin-bottom:8px">👁 唯讀模式：只有管理者可以修改</div>
<div class="seg"><button id="v_l" class="on">清單</button><button id="v_m">位置圖</button></div>
<div class="bar"><input id="q" type="search" placeholder="搜尋型號、品牌、位置…"><button class="p" id="add">＋ 新增</button></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div id="mtool" class="row" hidden style="flex-wrap:wrap"><button data-g="ac">＋ 新增一欄</button><button data-g="ar">＋ 新增一列</button><button data-g="dc">－ 刪除最後一欄</button><button data-g="dr">－ 刪除最後一列</button><button data-g="undo">↩ 復原上一步</button><button data-g="hist">🕘 歷史紀錄</button></div>
<div id="mmsg" class="s" style="color:var(--warn)"></div>
<div id="map" hidden></div>
<dialog id="dlg">
<b id="dt">新增刀具</b>
<div id="photoBox"><label>照片</label><div class="row" style="margin-top:4px"><img id="f_prev" class="th" alt="" hidden><input id="f_file" type="file" accept="image/*" style="flex:1;min-width:0"><button id="f_rm" hidden>移除照片</button></div></div>
<label>類別</label><select id="f_cat"></select>
<label>型號 / 名稱</label><input id="f_model" placeholder="例：CNMG120408、MCLNR2525M12">
<div class="g"><div><label>品牌</label><input id="f_brand"></div><div><label>規格（材質/塗層/直徑）</label><input id="f_spec"></div></div>
<div class="g"><div><label>庫存數量</label><input id="f_qty" type="number" min="0" value="0"></div><div><label>最低庫存（低於警示）</label><input id="f_min" type="number" min="0" value="0"></div></div>
<label>最高庫存（超過警示，0 表示不限）</label><input id="f_max" type="number" min="0" value="0">
<label>補貨交期（天）</label><input id="f_lead" type="number" min="1" value="7">
<label>備註</label><textarea id="f_note" rows="2"></textarea>
<div id="perr" class="s" style="color:var(--warn)"></div>
<div class="row"><button id="cancel" style="margin-left:auto">取消</button><button class="p" id="save">儲存</button></div>
</dialog>
<dialog id="sdlg"></dialog>
<dialog id="hdlg"></dialog>
<dialog id="cdlg"><b id="ct_">位置</b><div class="s">一行一支刀桿</div><textarea id="c_t" rows="6" style="width:100%;margin-top:6px"></textarea><div class="row"><button id="c_x" style="margin-left:auto">關閉</button><button class="p" id="c_s">儲存</button></div></dialog>
<dialog id="zdlg"><img id="zimg" alt="" style="width:100%;border-radius:8px"><div class="row"><button id="zc" style="margin-left:auto">關閉</button></div></dialog>
</main>
<script>
const CATS=["車刀刀片","車刀刀桿","銑刀","銑刀刀桿"];
let items=null,cat="全部",editId=null,pend=null;
try{items=JSON.parse(localStorage.getItem("tools")||"null")}catch(e){}
if(!Array.isArray(items))items=[
{id:1,cat:"車刀刀片",model:"CNMG120408",brand:"",spec:"TiAlN 塗層",qty:12,min:5,loc:"A-1",note:""},
{id:2,cat:"車刀刀桿",model:"MCLNR2525M12",brand:"",spec:"25x25 外徑",qty:2,min:1,loc:"A-2",note:""},
{id:3,cat:"銑刀",model:"φ10 4刃端銑刀",brand:"",spec:"鎢鋼",qty:3,min:4,loc:"B-1",note:""},
{id:4,cat:"銑刀刀桿",model:"BT40-ER32",brand:"",spec:"",qty:4,min:2,loc:"B-2",note:""}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let canW=!window.claude;
const whoP=(async()=>{if(!window.claude)return true;try{const u=await claude.use("user");return u?await u.canEdit():false}catch(e){return false}})();
let logs={},dbh=null;try{logs=JSON.parse(localStorage.getItem("toollogs")||"{}")||{}}catch(e){}
let ref=null,timer=null;
function save(){try{localStorage.setItem("tools",JSON.stringify(items))}catch(e){}
 if(ref){clearTimeout(timer);timer=setTimeout(()=>{ref.set({items}).catch(()=>{})},400)}}
(async()=>{try{
 if(!window.claude)return;
 const db=await claude.use("db");if(!db)return;dbh=db;
 const r=db.doc("inventory/main"),s=await r.get();
 if(s.exists&&Array.isArray(s.data().items)){items=JSON.parse(JSON.stringify(s.data().items));render()}else if(await whoP){await r.set({items})}
 ref=r;
 try{const q=await db.collection("logs").get();q.docs.forEach(d=>{const l=d.data().l;if(Array.isArray(l))logs[d.id]=JSON.parse(JSON.stringify(l))});render()}catch(e){}
 try{const pq=await db.collection("photos").get();pq.docs.forEach(d=>{const v=d.data().d;if(typeof v==="string")pics[d.id]=v});render()}catch(e){}
 try{const lr=db.doc("layout/main"),ls=await lr.get();if(ls.exists&&ls.data().c){const d0=ls.data();cells=JSON.parse(JSON.stringify(d0.c));if(d0.nc&&d0.nr)setGrid(d0.nc,d0.nr);render()}else if(await whoP){await lr.set({c:cells,nc:NC,nr:NR})}lref=lr}catch(e){}
 try{const hr=db.doc("layout/hist"),hs=await hr.get();if(hs.exists&&Array.isArray(hs.data().h))hist=clone(hs.data().h);hrf=hr}catch(e){}
}catch(e){}})();
$("f_cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function render(){
 $("list").className=canW?"":"ro";$("rob").hidden=canW;
 $("v_l").className=view==="l"?"on":"";$("v_m").className=view==="m"?"on":"";
 const L=view==="l";$("tabs").hidden=!L;$("list").hidden=!L;$("add").hidden=!L||!canW;$("map").hidden=L;$("mtool").hidden=L||!canW;
 if(!L){renderMap();return}
 $("tabs").innerHTML=["全部",...CATS].map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 const k=$("q").value.trim().toLowerCase();
 const rs=items.filter(i=>(cat==="全部"||i.cat===cat)&&(!k||[i.model,i.brand,i.spec,i.note,locs(i).join(" ")].join(" ").toLowerCase().includes(k)));
 $("list").innerHTML=rs.length?rs.map(i=>{const low=i.qty<=i.min,high=i.max>0&&i.qty>i.max,st=stats(i);return `<div class="card"><div class="top"><div style="display:flex;gap:10px;min-width:0">${imgSrc(i)?`<img class="th" alt="" src="${imgSrc(i)}" data-a="zoom" data-i="${i.id}">`:""}<div><div class="m">${esc(i.model)}</div><div class="s">${esc([i.brand,i.spec].filter(Boolean).join(" · "))}</div></div></div><span class="tag">${i.cat}</span></div>
 <div class="s">${i.note?esc(i.note)+" ":""}${locs(i).map(k=>`<button class="tag" data-a="goto" data-k="${k}" style="cursor:pointer">在 ${k} 格</button>`).join(" ")}</div>
 ${st?`<div class="s">📈 週均 ${st.avgW.toFixed(1)}｜月均 ${st.avgM.toFixed(1)}｜建議最低 ${st.reorder}</div>`:""}
 <div class="row"><div class="q"><button data-a="dec" data-i="${i.id}">−</button><b class="${low?"low":high?"high":""}">${i.qty}</b><button data-a="inc" data-i="${i.id}">＋</button>${low?'<span class="tag low">庫存偏低</span>':""}${high?'<span class="tag high">庫存偏高</span>':""}</div>
 <button data-a="stat" data-i="${i.id}">用量</button><button data-a="edit" data-i="${i.id}">編輯</button><button data-a="del" data-i="${i.id}" ${pend===i.id?'class="p" style="background:var(--warn);border-color:var(--warn)"':""}>${pend===i.id?"再按一次確定刪除":"刪除"}</button></div></div>`}).join(""):'<div class="empty">沒有符合的刀具</div>';
}
function openForm(it){
 editId=it?it.id:null;pdata=null;$("dt").textContent=it?"編輯刀具":"新增刀具";
 const d=it||{cat:cat==="全部"?CATS[0]:cat,model:"",brand:"",spec:"",qty:0,min:0,max:0,lead:7,note:""};
 $("f_cat").value=d.cat;$("f_model").value=d.model;$("f_brand").value=d.brand;$("f_spec").value=d.spec;
 $("f_qty").value=d.qty;$("f_min").value=d.min;$("f_max").value=d.max||0;$("f_lead").value=d.lead||7;pimg=d.img||null;$("f_file").value="";$("perr").textContent="";showPrev(pimg?imgSrc(d):null);$("f_note").value=d.note;$("dlg").showModal();
}
$("add").onclick=()=>{if(canW)openForm()};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
 const model=$("f_model").value.trim();if(!model){$("f_model").focus();return}
 const d={cat:$("f_cat").value,model,brand:$("f_brand").value.trim(),spec:$("f_spec").value.trim(),qty:Math.max(0,+$("f_qty").value||0),min:Math.max(0,+$("f_min").value||0),max:Math.max(0,+$("f_max").value||0),lead:Math.max(1,+$("f_lead").value||7),note:$("f_note").value.trim()};
 const nid=editId||Date.now();
 if(pdata){pics[nid]=pdata;d.img=true;if(dbh)try{await dbh.doc("photos/"+nid).set({d:pdata})}catch(e){$("perr").textContent="照片儲存失敗，請稍後再試";return}}
 else if(pimg){d.img=pimg}
 else{d.img=null;delete pics[nid];if(dbh)dbh.doc("photos/"+nid).delete().catch(()=>{})}
 if(editId){Object.assign(items.find(i=>i.id===editId),d)}else{items.unshift({id:nid,...d})}
 save();$("dlg").close();render();
};
$("q").oninput=()=>{focusK=null;render()};
$("tabs").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};
$("list").onclick=e=>{
 const a=e.target.dataset.a,id=+e.target.dataset.i;if(!a)return;
 if(a==="goto"){view="m";focusK=e.target.dataset.k;$("q").value="";render();return}
 if(!canW&&a!=="stat"&&a!=="zoom")return;
 if(a!=="del"&&pend!==null){pend=null}
 const it=items.find(i=>i.id===id);
 if(a==="inc")it.qty++;else if(a==="dec"){if(it.qty>0){it.qty--;addLog(id,1,Math.floor(Date.now()/6e4))}}
 else if(a==="edit")return openForm(it);
 else if(a==="stat")return openStats(id);
 else if(a==="zoom"){$("zimg").src=imgSrc(it);return $("zdlg").showModal()}
 else if(a==="del"){if(pend!==id){pend=id;render();return}items=items.filter(i=>i.id!==id);dropLog(id);delete pics[id];if(dbh)dbh.doc("photos/"+id).delete().catch(()=>{})}
 pend=null;save();render();
};
const DAY=864e5,lt={};
function saveLog(id){try{localStorage.setItem("toollogs",JSON.stringify(logs))}catch(e){}
 if(!dbh)return;clearTimeout(lt[id]);lt[id]=setTimeout(()=>dbh.doc("logs/"+id).set({l:logs[id]||[]}).catch(()=>{}),500)}
function addLog(id,n,t){const l=logs[id]=logs[id]||[];l.push([t,n]);if(l.length>800)logs[id]=l.slice(-800);saveLog(id)}
function dropLog(id){delete logs[id];try{localStorage.setItem("toollogs",JSON.stringify(logs))}catch(e){}clearTimeout(lt[id]);if(dbh)dbh.doc("logs/"+id).delete().catch(()=>{})}
function stats(it){
 const l=logs[it.id]||[],now=Date.now();if(!l.length)return null;
 const first=Math.min(...l.map(x=>x[0]))*6e4,W=Math.min(12,Math.max(1,Math.ceil((now-first)/(7*DAY))));
 const wk=Array(W).fill(0);l.forEach(([t,n])=>{const k=Math.floor((now-t*6e4)/(7*DAY));if(k>=0&&k<W)wk[k]+=n});
 const avgW=wk.reduce((a,b)=>a+b,0)/W,maxW=Math.max(...wk),lead=it.lead||7;
 const safety=Math.ceil(Math.max(0,maxW-avgW)*lead/7),reorder=Math.ceil(avgW/7*lead)+safety;
 const mo=[],d=new Date();for(let i=0;i<6;i++){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,1);let c=0;l.forEach(([t,n])=>{const m=t*6e4;if(m>=a&&m<b)c+=n});mo.push([a.getFullYear()+"/"+(a.getMonth()+1),c])}
 return{W,wk,avgW,maxW,avgM:avgW/7*30,safety,reorder,lead,mo}
}
const fmt=t=>new Date(t*6e4).toLocaleString("zh-TW",{hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
const loc=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
let sid=null;
function openStats(id){
 sid=id;const it=items.find(i=>i.id===id),st=stats(it),l=logs[id]||[];
 const row=(a,b)=>`<div class="r"><span>${a}</span><b>${b}</b></div>`;
 let h=`<b>${esc(it.model)} 用量</b><div class="s">按卡片上的「−」會自動記錄領用時間</div>`;
 if(st){
  h+=`<div class="h">統計（近 ${st.W} 週）</div>`+row("平均週用量",st.avgW.toFixed(1))+row("平均月用量（30天）",st.avgM.toFixed(1))+row("最高週用量",st.maxW)+row("補貨交期",st.lead+" 天（編輯中可改）")+row("建議安全量",st.safety)+row("建議最低庫存",st.reorder)
  +`<div class="row"><button class="p" data-a="apply">套用為最低庫存（${st.reorder}）</button></div><div class="s">建議最低庫存 = 平均日用量 × 交期 + 安全量；安全量 = (最高週用量 − 平均週用量) × 交期 ÷ 7</div>`
  +`<div class="h">每週用量</div>`+st.wk.slice(0,8).map((c,k)=>row(k?`${k*7+1}–${k*7+7} 天前`:"近 7 天",c)).join("")
  +`<div class="h">每月用量</div>`+st.mo.map(m=>row(m[0],m[1])).join("");
 }else h+='<div class="empty">尚無領用紀錄</div>';
 h+=`<div class="adm"><div class="h">補登領用</div><div class="g"><div><label>數量</label><input id="s_n" type="number" min="1" value="1"></div><div><label>領用時間</label><input id="s_t" type="datetime-local" value="${loc(Date.now())}"></div></div>
 <label><input id="s_d" type="checkbox" style="width:auto"> 同時扣減庫存</label><div class="row"><button data-a="addlog">新增紀錄</button></div></div>`;
 if(l.length)h+=`<div class="h">最近紀錄（刪除紀錄不會改庫存）</div>`+l.map((x,k)=>[x,k]).slice(-10).reverse().map(([x,k])=>`<div class="r"><span>${fmt(x[0])}　領 ${x[1]}</span><button data-a="dellog" data-k="${k}">刪除</button></div>`).join("");
 h+='<div class="row"><button data-a="close" style="margin-left:auto">關閉</button></div>';
 $("sdlg").className=canW?"":"ro";$("sdlg").innerHTML=h;if(!$("sdlg").open)$("sdlg").showModal();
}
$("sdlg").onclick=e=>{
 const a=e.target.dataset.a;if(!a)return;const it=items.find(i=>i.id===sid);
 if(!canW&&a!=="close")return;
 if(a==="close")return $("sdlg").close();
 if(a==="apply"){it.min=stats(it).reorder;save();render()}
 else if(a==="addlog"){const n=Math.floor(+$("s_n").value),t=new Date($("s_t").value).getTime();if(!(n>0)||isNaN(t))return;addLog(sid,n,Math.floor(t/6e4));if($("s_d").checked){it.qty=Math.max(0,it.qty-n);save();render()}}
 else if(a==="dellog"){logs[sid].splice(+e.target.dataset.k,1);saveLog(sid)}
 openStats(sid);
};

let pdata=null,pimg=null,pics={};
const imgSrc=i=>pics[i.id]||(typeof i.img==="string"?"/_blob/"+i.img:"");
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.72,d=c.toDataURL("image/jpeg",q);while(d.length>180000&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}d.length>200000?no(new Error("x")):ok(d)};im.onerror=()=>no(new Error("x"));im.src=u})}
function showPrev(src){const im=$("f_prev");if(src){im.src=src;im.hidden=false;$("f_rm").hidden=false}else{im.removeAttribute("src");im.hidden=true;$("f_rm").hidden=true}}
$("f_file").onchange=async()=>{const f=$("f_file").files[0];if(!f)return;$("perr").textContent="";try{pdata=await shrink(f);showPrev(pdata)}catch(e){pdata=null;$("perr").textContent="無法讀取這張圖片"}};
$("f_rm").onclick=()=>{pdata=null;pimg=null;$("f_file").value="";showPrev(null)};
$("zdlg").onclick=()=>$("zdlg").close();

const cn=i=>(i>=26?String.fromCharCode(64+Math.floor(i/26)):"")+String.fromCharCode(65+i%26);
let NC=9,NR=8,COLS=[];
const setGrid=(c,r)=>{NC=Math.max(1,Math.min(52,+c||9));NR=Math.max(1,Math.min(60,+r||8));COLS=Array.from({length:NC},(_,i)=>cn(i))};
setGrid(9,8);
let view="l",focusK=null,cells=null,ck=null,lref=null,cto=null;
const SEED=[
["PCHPR S25-34","S16Q-SDUCR11","GEHR2525M02-10L","SVQCR-2525M16","SVKCR-2525M11|KGMR-2525M-3T10L","15.5EDX-4D-25|KGBSR2525M22NS(HG)","EGEHR-25B-3D-20|C10M-SDUCR07-13","",""],
["ETFNL-2525M16|ETQNR-2525M16","ETJNL2525M16|ETJNR2525M16","EDGTR-25B-2D-14","SVUCR-2525M16|EDJNR-2525M15","H08K-STUPR09-10|H08K-SCLCR06-09","SS16-DRA140M-8|TID130F16-5","S25R-ETUNL16","C04G-SCLCR03-05|C06J-SCLCR04-07|C06J-TUBR06-07","EVJNR-2020K16"],
["套筒25","套筒16","套筒12","套筒8","套筒錐度","S16Q-SCLCR-09|S20R-SCLCR-09","XC20R-SDQCR11|E20R-SDUCR11-23","DDHNR2525M-150","A25M-HFHR60-75|S25R-USR 3"],
["套筒20","套筒14","套筒10","套筒6","DRILL套筒","E16R-SDUCR11-20|E14M-SDUCR07-18","C05H-SCLCR03-06|C10M-SCLCR06-12","S20R-MTQNL-16|S20R-MTQNR-16","S16Q-SVQCR11-22|C0806K-SVLCR05-10"],
["SDQCR-2020K-11|SDQCR-2525M-11","DGTR 25B-2D35","GHDR2020K-3-10L|GHDR2525M-3-10L","SVQCR-2020K-11|SVQCR-2525M-11","MGIVR-2620M3|GIVR2020-2B","CH-2525M-08|ECH2525M06","C16M-SCLCR09-18|C14M-SCLCR06-16","SCK2|SCK1","A20R-MTQNR-16"],
["SVQCL-2525M16","WCLNR-2525M-12","DVJNR-2525M-16","AGHSR-2525M04","GHDL-2525M-3-10L","SVJCR-2525M16","ETJNR-2525M16","S25R-NNTOR2|ZTIR-E1008K-GER-B","GHDR-2020K-4-10L"],
["WDX38-C32-2D-76L","HCAP-10R-C12-3D-30|HCAP-20R-C25-3D-60","SP16.5/2D-C25|HCAP-20R-C25-2.25D-45","C12M-SVUCR08-16","ETGDR-25-4M","C08K-SCLCR06-10|C0805K-SCLCR03-06","A16Q SDUNR 0803","A25R-MWLNR-08|A20R-MWLNR-08","WDX32-C32-2D-64L|WDX40-C32-2D-80L"],
["WDX30-C32-3D-90L","WDX26-C32-3D-78L","SNF20R-2.5D-C25","158E-2525M-14/00-J","C06J-SCLCR04-07","AAWLNR-2525MWP|EWLNR-2525M08","WDX18-C25-2D-36L","S1607K-SCLCR-06-L20","MTQNR-2525M-16|WTQNR-2525M-16"]];
try{cells=JSON.parse(localStorage.getItem("toolcells")||"null");const g=JSON.parse(localStorage.getItem("toolgrid")||"null");if(g)setGrid(g.nc,g.nr)}catch(e){}
if(!cells){cells={};SEED.forEach((row,ri)=>row.forEach((v,ci)=>{if(v)cells[COLS[ci]+(ri+1)]=v.split("|").join("\n")}))}
const nz=v=>String(v||"").toUpperCase().replace(/[\s\-_]/g,"");
const lines=k=>(cells[k]||"").split("\n").map(x=>x.trim()).filter(Boolean);
function locs(it){const n=nz(it.model),o=[];if(!n)return o;for(const c of COLS)for(let r=1;r<=NR;r++){const k=c+r;if(lines(k).some(x=>nz(x)===n))o.push(k)}return o}
function saveCells(){try{localStorage.setItem("toolcells",JSON.stringify(cells));localStorage.setItem("toolgrid",JSON.stringify({nc:NC,nr:NR}))}catch(e){}
 if(lref){clearTimeout(cto);cto=setTimeout(()=>lref.set({c:cells,nc:NC,nr:NR}).catch(()=>{}),400)}}
function renderMap(){
 const q=nz($("q").value);let h='<div class="mg'+(q||focusK?" f":"")+'" style="grid-template-columns:24px repeat('+NC+',minmax(104px,1fr));min-width:'+(24+NC*108)+'px"><div></div>'+COLS.map(c=>`<div class="mh">${c}</div>`).join("");
 for(let r=1;r<=NR;r++){h+=`<div class="rl">${r}</div>`;for(const c of COLS){const k=c+r,ls=lines(k),hit=q?ls.some(x=>nz(x).includes(q)):k===focusK;h+=`<div class="c${hit?" hit":""}" data-k="${k}">${ls.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`}}
 $("map").innerHTML=h+"</div>";
 const el=$("map").querySelector(".hit");if(el)el.scrollIntoView({block:"nearest",inline:"center"})
}
$("v_l").onclick=()=>{view="l";render()};
$("v_m").onclick=()=>{view="m";focusK=null;render()};
$("map").onclick=e=>{const c=e.target.closest(".c");if(!c)return;ck=c.dataset.k;$("ct_").textContent=ck+" 格";$("c_t").value=lines(ck).join("\n");$("c_t").readOnly=!canW;$("c_s").hidden=!canW;$("cdlg").showModal()};
$("mtool").onclick=e=>{const g=e.target.dataset.g;if(!g||!canW)return;let msg="";
 if(g==="undo"){if(!hist.length){$("mmsg").textContent="沒有可以復原的步驟";return}const h=hist.pop();saveHist();applySnap(h);$("mmsg").textContent="已復原："+h.n;return}
 if(g==="hist")return openHist();
 const S={t:Date.now(),c:clone(cells),nc:NC,nr:NR,n:{ac:"新增一欄",ar:"新增一列",dc:"刪除最後一欄",dr:"刪除最後一列"}[g]};
 const colUsed=()=>Array.from({length:NR},(_,i)=>lines(COLS[NC-1]+(i+1)).length).some(Boolean);
 if(g==="ac")setGrid(NC+1,NR);else if(g==="ar")setGrid(NC,NR+1);
 else if(g==="dc"){if(NC<=1)msg="至少要保留一欄";else if(colUsed())msg=COLS[NC-1]+" 欄還有內容，請先清空再刪除";else setGrid(NC-1,NR)}
 else if(g==="dr"){if(NR<=1)msg="至少要保留一列";else if(COLS.some(c=>lines(c+NR).length))msg="第 "+NR+" 列還有內容，請先清空再刪除";else setGrid(NC,NR-1)}
 if(NC!==S.nc||NR!==S.nr){hist.push(S);saveHist()}
 saveCells();render();$("mmsg").textContent=msg};
let hist=[],hrf=null,hto=null;
try{hist=JSON.parse(localStorage.getItem("toolhist")||"[]")||[]}catch(e){}
const clone=o=>JSON.parse(JSON.stringify(o));
function saveHist(){while(hist.length>20||(hist.length>1&&JSON.stringify(hist).length>200000))hist.shift();
 try{localStorage.setItem("toolhist",JSON.stringify(hist))}catch(e){}
 if(hrf){clearTimeout(hto);hto=setTimeout(()=>hrf.set({h:hist}).catch(()=>{}),500)}}
function snap(n){hist.push({t:Date.now(),c:clone(cells),nc:NC,nr:NR,n});saveHist()}
function applySnap(h){cells=clone(h.c);setGrid(h.nc,h.nr);saveCells();render()}
function openHist(){const d=$("hdlg");
 d.innerHTML='<b>位置圖歷史紀錄</b><div class="s">還原前會先保留目前的版本，所以還原後也能再復原</div>'+(hist.length?hist.map((h,i)=>[h,i]).reverse().map(([h,i])=>`<div class="r"><span>${fmt(Math.floor(h.t/6e4))}　${esc(h.n)}</span><button data-h="${i}">還原</button></div>`).join(""):'<div class="empty">尚無紀錄</div>')+'<div class="row"><button data-h="x" style="margin-left:auto">關閉</button></div>';
 if(!d.open)d.showModal()}
$("hdlg").onclick=e=>{const v=e.target.dataset.h;if(v===undefined)return;if(v==="x")return $("hdlg").close();if(!canW)return;const h=hist[+v];if(!h)return;snap("還原前（"+fmt(Math.floor(h.t/6e4))+" 的版本）");applySnap(h);$("hdlg").close()};

$("c_x").onclick=()=>$("cdlg").close();
$("c_s").onclick=()=>{if(!canW)return;const v=$("c_t").value.split("\n").map(x=>x.trim()).filter(Boolean).join("\n");if(v!==lines(ck).join("\n"))snap("修改 "+ck+" 格");if(v)cells[ck]=v;else delete cells[ck];saveCells();$("cdlg").close();render()};

whoP.then(v=>{canW=v;render()});
render();
</script></body></html>
